[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rskit"
version = "0.2.0"
description = "Python interface for RNA-seq analysis tools"
requires-python = ">=3.8"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.5.0",
    "pydeseq2==0.5.4",
    "pytximport==0.13.0",
    "PyWGCNA==2.2.1",
]

[project.scripts]
rskit = "rskit.cli:main"
