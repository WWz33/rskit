name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ruff
      - name: Ruff
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: ".[all]"
          - python-version: "3.12"
            extras: ".[all]"
          - python-version: "3.13"
            extras: ".[all]"
          # minimal install: the quantification phase must work without the
          # analysis backends
          - python-version: "3.12"
            extras: "."
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e "${{ matrix.extras }}" pytest pytest-cov
      - name: Test
        run: pytest -q --cov=rskit --cov-report=term-missing --cov-fail-under=80
